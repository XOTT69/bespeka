name: Deploy Cloudflare alert Worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "cloudflare-worker/**"
      - "wrangler.toml"
      - ".github/workflows/deploy-cloudflare-worker.yml"

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Wrangler
        run: npm install --global wrangler@4

      - name: Upload alerts.in.ua secret to Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ALERTS_TOKEN: ${{ secrets.ALERTS_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$ALERTS_TOKEN"
          printf "%s" "$ALERTS_TOKEN" | wrangler secret put ALERTS_TOKEN

      - name: Deploy Worker
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          wrangler deploy 2>&1 | tee deploy.log
          WORKER_URL=$(grep -Eo 'https://[A-Za-z0-9._-]+\.workers\.dev' deploy.log | tail -n1)
          if [ -z "$WORKER_URL" ]; then
            echo "Could not detect workers.dev URL"
            cat deploy.log
            exit 1
          fi
          echo "worker_url=$WORKER_URL" >> "$GITHUB_OUTPUT"

      - name: Verify shelter API
        env:
          WORKER_URL: ${{ steps.deploy.outputs.worker_url }}
        run: |
          set +e
          HTTP_CODE=$(curl --silent --show-error --retry 1 --max-time 150 -w "%{http_code}" "${WORKER_URL}/shelters" -o shelter-health-source.json)
          CURL_EXIT=$?
          export HTTP_CODE CURL_EXIT
          node - <<'NODE'
          const fs = require('fs');
          let raw = '';
          try { raw = fs.readFileSync('shelter-health-source.json','utf8'); } catch {}
          let d = null;
          try { d = JSON.parse(raw); } catch {}
          const health = {
            ok: false,
            http_code: process.env.HTTP_CODE || null,
            curl_exit: Number(process.env.CURL_EXIT || -1),
            total: Array.isArray(d?.shelters) ? d.shelters.length : 0,
            kyiv_official: Number(d?.counts?.kyiv_official || 0),
            oblast_dsns: Number(d?.counts?.oblast_dsns || d?.counts?.dsns || 0),
            partial: Boolean(d?.partial),
            error: d?.error || null,
            message: d?.message || null,
            checked_at: new Date().toISOString()
          };
          health.ok = health.http_code === '200' && health.total > 0 && health.oblast_dsns > 0;
          fs.writeFileSync('data-health.json', JSON.stringify(health, null, 2) + '\n');
          console.log(health);
          NODE
          rm -f shelter-health-source.json

      - name: Point PWA to Worker
        env:
          WORKER_URL: ${{ steps.deploy.outputs.worker_url }}
        run: |
          cat > alert-config.js <<EOF
          // Automatically generated by GitHub Actions.
          window.BESPEKA_ALERT_PROXY_URL = "${WORKER_URL}/status";
          EOF

          git config user.name "bespeka-deploy-bot"
          git config user.email "actions@users.noreply.github.com"
          git add alert-config.js data-health.json
          if git diff --cached --quiet; then
            echo "PWA already points to this Worker"
            exit 0
          fi
          git commit -m "Point PWA to Cloudflare alert Worker"
          git pull --rebase origin main
          git push
