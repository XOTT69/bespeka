<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1220">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Безпека">
  <title>Безпека — укриття і тривоги</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div class="brand-row">
        <div class="brand"><span class="brand-icon">🛡️</span><div><strong>Безпека</strong><small>Київ та Київська область</small></div></div>
        <button id="installBtn" class="round-btn hidden" aria-label="Встановити">＋</button>
      </div>
      <button id="alertBanner" class="alert-banner alert-unknown" data-tab="alerts">
        <span class="alert-dot"></span>
        <span class="alert-copy"><strong id="alertTitle">Перевіряю тривоги…</strong><small id="alertText">Київська область</small></span>
        <span class="chevron">›</span>
      </button>
    </header>

    <section id="shelterControls" class="shelter-controls">
      <div class="search-row">
        <input id="search" type="search" placeholder="Знайти адресу або населений пункт" autocomplete="off">
        <button id="locateBtn" class="locate-btn" aria-label="Моє місцезнаходження">⌖</button>
      </div>
      <div class="chips">
        <button class="chip active" data-filter="all">Усі</button>
        <button class="chip" data-filter="oblast">Область</button>
        <button class="chip" data-filter="kyiv">Київ</button>
        <button class="chip" data-filter="accessible">♿ Доступні</button>
        <button class="chip" data-filter="favorites">★ Обрані</button>
      </div>
    </section>

    <main class="views">
      <section id="mapView" class="view active">
        <div id="map"></div>
        <div id="dataBadge" class="data-badge">Завантажую укриття…</div>
        <button id="nearestCard" class="nearest-card hidden">
          <span class="nearest-icon">⌖</span>
          <span class="nearest-copy"><small>Найближче укриття</small><strong id="nearestName">—</strong><span id="nearestMeta">—</span></span>
          <span class="chevron">›</span>
        </button>
      </section>

      <section id="listView" class="view list-view">
        <div class="list-summary">
          <strong id="listCount">Укриття</strong>
          <small id="listHint">Усі доступні точки</small>
        </div>
        <div id="shelterList" class="shelter-list"></div>
      </section>

      <section id="alertsView" class="view alerts-view">
        <div class="alerts-scope">
          <button class="scope-btn active" data-alert-scope="kyiv">Київщина</button>
          <button class="scope-btn" data-alert-scope="ukraine">Україна</button>
        </div>
        <div class="alerts-map-wrap">
          <div id="alertsMap"></div>
          <div class="alerts-legend"><span><i class="dot red"></i> Тривога</span><span><i class="dot yellow"></i> Часткова/жовта</span></div>
        </div>
        <div class="threats-panel">
          <div class="section-title"><div><strong id="threatsTitle">Тривоги по районах</strong><small id="alertsUpdated">Оновлюю…</small></div><span id="activeRegionsCount" class="count-pill">0</span></div>
          <div id="threatList" class="threat-list"></div>
        </div>
      </section>
    </main>

    <nav class="bottom-nav" aria-label="Навігація">
      <button class="nav-btn active" data-tab="map"><span>⌖</span><small>Укриття</small></button>
      <button class="nav-btn" data-tab="list"><span>☰</span><small>Список</small></button>
      <button class="nav-btn" data-tab="alerts"><span>⚠</span><small>Тривоги</small></button>
    </nav>
  </div>

  <aside id="sheet" class="sheet">
    <div class="sheet-handle"></div>
    <button id="closeSheet" class="close-btn" aria-label="Закрити">×</button>
    <div id="sheetContent"></div>
  </aside>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script src="./alert-config.js"></script>
  <script src="./app.js"></script>
</body>
</html>
