name: Update Kyiv Oblast alert status

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch active alerts safely
        env:
          ALERTS_TOKEN: ${{ secrets.ALERTS_TOKEN }}
        run: |
          if [ -z "$ALERTS_TOKEN" ]; then
            echo "ALERTS_TOKEN secret is missing"
            exit 1
          fi

          curl --fail --silent --show-error             -H "Authorization: Bearer $ALERTS_TOKEN"             "https://api.alerts.in.ua/v1/alerts/active.json"             -o alerts.json

          ACTIVE=$(jq '[.alerts[] | select(
            .alert_type == "air_raid" and
            (
              .location_title == "Київська область" or
              .location_oblast == "Київська область"
            )
          )] | length > 0' alerts.json)

          jq -n             --argjson active "$ACTIVE"             --arg updated_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)"             '{
              active: $active,
              status: (if $active then "active" else "safe" end),
              text: "Київська область",
              updated_at: $updated_at
            }' > alert-status.json

      - name: Commit status when changed
        run: |
          rm -f alerts.json
          git config user.name "bespeka-alert-bot"
          git config user.email "actions@users.noreply.github.com"
          git add alert-status.json
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Update Kyiv Oblast alert status"
          git push
