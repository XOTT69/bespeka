name: Refresh shelter snapshot

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/update-shelters.cjs"
      - ".github/workflows/update-shelters.yml"
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch shelter data
        run: node scripts/update-shelters.cjs
      - name: Commit snapshot
        run: |
          git config user.name "bespeka-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add shelters.json
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Refresh shelter snapshot"
          git pull --rebase origin main
          git push
